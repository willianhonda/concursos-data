name: Atualizar concursos

on:
  schedule:
    # Todo dia às 09:00 UTC (06:00 em Brasília). O GitHub pode atrasar alguns minutos.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Dias para trás na busca"
        default: "7"
      previstos_days:
        description: "Dias para trás na busca de concursos previstos (use 365 na primeira carga)"
        default: "7"

permissions:
  contents: write

concurrency:
  group: atualizar-concursos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Testes do extrator
        run: python -m unittest discover -s tests -v

      - name: Guardar o feed publicado
        run: cp docs/concursos.json "$RUNNER_TEMP/anterior.json"

      - name: Gerar docs/concursos.json
        run: python scripts/build_feed.py --days "${{ github.event.inputs.days || '7' }}"
        env:
          # Cadastro gratuito em https://inlabs.in.gov.br. Sem os secrets, o DOU é pulado.
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_PASSWORD: ${{ secrets.INLABS_PASSWORD }}
          # Fontes novas (veja "Fontes novas e modo sombra" no README). Variáveis do repositório, listas separadas por vírgula.
          # SOURCES_ON: entram no feed; SOURCES_SHADOW: só gravam shadow/fontes-novas.json; SOURCES_OFF: kill switch.
          SOURCES_ON: ${{ vars.SOURCES_ON }}
          SOURCES_SHADOW: ${{ vars.SOURCES_SHADOW || 'sigpub' }}
          SOURCES_OFF: ${{ vars.SOURCES_OFF }}

      # Se falhar, o job para aqui e o feed de ontem continua no ar.
      - name: Validar o feed para o app
        # Mudar SOURCES_OFF tira itens do feed de uma vez; aí o encolhimento é esperado.
        run: python scripts/validate_feed.py docs/concursos.json --previous "$RUNNER_TEMP/anterior.json" ${{ vars.SOURCES_OFF != '' && '--allow-shrink' || '' }}
        env:
          SOURCES_OFF: ${{ vars.SOURCES_OFF }}

      # Concursos autorizados no DOU, sem edital ainda. Arquivo separado, que as versões antigas do app
      # não leem: se falhar, volta o arquivo anterior e o feed é publicado normalmente.
      - name: Gerar e validar docs/previstos.json
        run: |
          python scripts/build_previstos.py --days "${{ github.event.inputs.previstos_days || '7' }}" \
            && python scripts/validate_previstos.py docs/previstos.json \
            || { echo "::warning::previstos.json não atualizado"; git checkout -- docs/previstos.json; }
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_PASSWORD: ${{ secrets.INLABS_PASSWORD }}

      - name: Publicar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/concursos.json docs/previstos.json
          [ -f shadow/fontes-novas.json ] && git add shadow/fontes-novas.json
          if git diff --cached --quiet; then
            echo "Sem mudanças no feed."
          else
            git commit -m "Atualiza concursos ($(date -u +%Y-%m-%d))"
            git push
          fi
